<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List, inline and block elements</title>

<style>
ul {
  /* list-style-type: disc;    */
    /* default filled circle */

  /* list-style-type: circle;   */
   /* hollow circle */

  list-style-type: square; 
   /* square bullets */

  /* list-style-type: none;   */
   /* no bullets */
}

ol {
  /* list-style-type: decimal;     */
    /* 1, 2, 3... */

  /* list-style-type: lower-roman;  */
   /* i, ii, iii... */

  list-style-type: upper-roman;  
  /* I, II, III... */

  /* list-style-type: lower-alpha; */
    /* a, b, c... */

  /* list-style-type: upper-alpha;  */
   /* A, B, C... */
}


</style>
</head>
<body>
    <h1>My List</h1>
    <h2>Unordered list</h2>
    <ul>
        <li>1
            <ol>
                <li>1.1</li>
                <li>1.2</li>
            </ol>
        </li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
        <li>5</li>
    </ul>
<h2>ordered list</h2>
    <ol>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ol>

    <dl>
        <dt>Ice Tea</dt>
        <dd>Leamon ice tea</dd>
    </dl>

    <h3>Test 1</h3>
    <p>Test 2</p>
    <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Minus,<span>Test 3 </span>delectus.</p>
</body>
</html>
